name: Ignore Global-only content

on:
  workflow_dispatch:
    inputs:
      source_identity:
        description: "Composite Global source identity, e.g. news:cnt_000177"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ignore-global-content-diff-${{ inputs.source_identity }}
  cancel-in-progress: false

jobs:
  ignore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Japan repository
        uses: actions/checkout@v4
        with:
          ref: main
          path: japan
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Global repository
        uses: actions/checkout@v4
        with:
          repository: querypie/corp-web-v2
          ref: main
          path: global

      - name: Build live dry-run report
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node japan/scripts/global-content-diff-report/cli.mjs
          --global-repo "$GITHUB_WORKSPACE/global"
          --target-repo "$GITHUB_WORKSPACE/japan"
          --dry-run
          > "$RUNNER_TEMP/global-content-diff-report.json"

      - name: Append ignore decision
        working-directory: japan
        env:
          SOURCE_IDENTITY: ${{ inputs.source_identity }}
          REPORT_PATH: ${{ runner.temp }}/global-content-diff-report.json
          GITHUB_ACTOR: ${{ github.actor }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          import { assertIgnoreAppendAllowed } from "./scripts/global-documentation-sync/ignore-workflow.mjs";

          const fail = (message) => {
            console.error(message);
            process.exit(1);
          };

          const sourceIdentity = process.env.SOURCE_IDENTITY || "";
          const pattern = /^(documentation|news):cnt_\d+$/;
          if (!pattern.test(sourceIdentity)) fail("Invalid source_identity; expected exact composite identity like news:cnt_000177");

          const reportEnvelope = JSON.parse(readFileSync(process.env.REPORT_PATH, "utf8"));
          const matchingItems = (reportEnvelope.report?.items || []).filter((item) => item.identity === sourceIdentity);
          if (matchingItems.length !== 1) fail(`Expected exactly one live report item for ${sourceIdentity}; found ${matchingItems.length}`);

          const item = matchingItems[0];
          if (item.status !== "Untracked") fail(`Expected ${sourceIdentity} to be Untracked in the live report; found ${item.status}`);

          const sourceSection = item.sourceSection;
          const sourceId = item.sourceId;
          const sourceCanonicalUrl = item.sourceUrl;
          const file = ".github/content-sync/ignore.json";
          const values = JSON.parse(readFileSync(file, "utf8"));
          assertIgnoreAppendAllowed({ values, sourceId, sourceSection, sourceCanonicalUrl });
          values.push({
            sourceSection,
            sourceId,
            sourceCanonicalUrl,
            reasonCode: "other",
            reason: "Ignored by owner from Global-only content report.",
            addedBy: process.env.GITHUB_ACTOR,
            addedAt: new Date().toISOString(),
          });
          values.sort((left, right) => String(left?.sourceSection || "").localeCompare(String(right?.sourceSection || "")) || String(left?.sourceId || "").localeCompare(String(right?.sourceId || "")));
          writeFileSync(file, `${JSON.stringify(values, null, 2)}\n`);
          writeFileSync(process.env.RUNNER_TEMP ? `${process.env.RUNNER_TEMP}/ignore-item.json` : "/tmp/ignore-item.json", `${JSON.stringify({ sourceIdentity, sourceSection, sourceId, sourceCanonicalUrl })}\n`);
          NODE

      - name: Create ignore pull request
        working-directory: japan
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          source_identity=$(jq -r .sourceIdentity "$RUNNER_TEMP/ignore-item.json")
          source_section=$(jq -r .sourceSection "$RUNNER_TEMP/ignore-item.json")
          source_id=$(jq -r .sourceId "$RUNNER_TEMP/ignore-item.json")
          source_canonical_url=$(jq -r .sourceCanonicalUrl "$RUNNER_TEMP/ignore-item.json")
          branch="content-sync-ignore/${source_identity/:/-}"

          git config user.name "QueryPie Global content diff"
          git config user.email "noreply@querypie.com"
          git switch -c "$branch"
          git add .github/content-sync/ignore.json
          git diff --cached --quiet && { echo "no ignore change" >&2; exit 1; }
          git commit -m "chore: ignore Global-only content $source_identity"
          git push --set-upstream origin "$branch"

          ignore_body=$(printf 'Ignore Global-only content source.\n\n- Identity: `%s`\n- Source: %s\n\n<!-- global-documentation-sync-ignore:v1 {"sourceSection":"%s","sourceId":"%s","sourceIdentity":"%s"} -->' "$source_identity" "$source_canonical_url" "$source_section" "$source_id" "$source_identity")
          ignore_pr=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title "Ignore Global-only content $source_identity" --body "$ignore_body")
          echo "ignore_pr=$ignore_pr" >> "$GITHUB_STEP_SUMMARY"
